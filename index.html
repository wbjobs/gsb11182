<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偏好设置</title>
  <script>
    // 首屏防主题闪烁：同步读取 localStorage 镜像先应用一次
    (function () {
      try {
        var raw = localStorage.getItem('prefs.settings.v1');
        var s = raw ? JSON.parse(raw) : {};
        var theme = s.theme || 'system';
        var dark = theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (s.fontSize) document.documentElement.style.fontSize = s.fontSize + 'px';
        if (s.language) document.documentElement.lang = s.language;
      } catch (e) { /* 隐私模式等场景下静默跳过 */ }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <nav>
      <div class="menu-item" data-i18n="menu1">菜单项一</div>
      <div class="menu-item" data-i18n="menu2">菜单项二</div>
      <div class="menu-item" data-i18n="menu3">菜单项三</div>
    </nav>
  </aside>

  <main id="main">
    <h1 data-i18n="title">偏好设置</h1>

    <section class="setting">
      <h2 data-i18n="theme">主题</h2>
      <label><input type="radio" name="theme" value="light" /> <span data-i18n="themeLight">亮</span></label>
      <label><input type="radio" name="theme" value="dark" /> <span data-i18n="themeDark">暗</span></label>
      <label><input type="radio" name="theme" value="system" /> <span data-i18n="themeSystem">跟随系统</span></label>
    </section>

    <section class="setting">
      <h2 data-i18n="fontSize">字体大小</h2>
      <input type="range" id="font-size" min="12" max="20" step="1" value="16" />
      <span id="font-size-value">16px</span>
    </section>

    <section class="setting">
      <h2 data-i18n="language">语言</h2>
      <select id="language">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
      </select>
    </section>

    <section class="setting">
      <h2 data-i18n="sidebar">侧边栏</h2>
      <label><input type="checkbox" id="sidebar-collapsed" /> <span data-i18n="sidebarToggle">折叠侧边栏</span></label>
    </section>

    <section class="setting">
      <button id="reset" data-i18n="reset">恢复默认</button>
    </section>

    <section class="setting meta">
      <span data-i18n="storageMode">存储模式</span>:
      <span id="storage-mode">-</span>
    </section>

    <section class="setting demo">
      <h2 data-i18n="demoTitle">演示内容</h2>
      <p data-i18n="demoText">这是一段演示文本，用于预览主题与字体大小效果。</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
